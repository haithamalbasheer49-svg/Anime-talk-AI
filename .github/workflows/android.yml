name: Build AnimeTalk AI APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Debug - Show Repository Files
        run: |
          echo "=== الملفات الموجودة في المستودع الرئيسي ==="
          ls -la

      - name: Extract project
        run: |
          if [ -f "AnimeTalkAI_Android_MVP.zip" ]; then
            mkdir -p appsrc
            unzip -q AnimeTalkAI_Android_MVP.zip -d appsrc
            echo "=== الملفات داخل مجلد appsrc بعد الفك ==="
            ls -la appsrc
          else
            echo "خطأ: ملف AnimeTalkAI_Android_MVP.zip غير موجود في المستودع!"
            exit 1
          fi

      - name: Find and Build APK
        run: |
          GRADLEW_PATH=$(find appsrc -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "خطأ: لم يتم العثور على ملف gradlew نهائياً!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "تم العثور على المشروع في المسار: $PROJECT_DIR"
          chmod +x "$GRADLEW_PATH"
          cd "$PROJECT_DIR" && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeTalkAI-APK
          path: appsrc/**/build/outputs/apk/debug/app-debug.apk
