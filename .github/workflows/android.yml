name: Build AnimeTalk AI APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q AnimeTalkAI_Android_MVP.zip -d appsrc

      - name: Grant execute permission for gradlew
        run: |
          chmod +x appsrc/gradlew

      - name: Build APK
        run: |
          cd appsrc && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeTalkAI-APK
          path: appsrc/app/build/outputs/apk/debug/app-debug.apk
