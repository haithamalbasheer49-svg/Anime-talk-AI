name: Build AnimeTalk AI APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir -p appsrc
          unzip -q AnimeTalkAI_Android_MVP.zip -d appsrc

      - name: Find and Build APK
        run: |
          # البحث تلقائياً عن ملف gradlew داخل المجلدات المفكوكة
          GRADLEW_PATH=$(find appsrc -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found project directory: $PROJECT_DIR"
          chmod +x "$GRADLEW_PATH"
          cd "$PROJECT_DIR" && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeTalkAI-APK
          path: appsrc/**/build/outputs/apk/debug/app-debug.apk
