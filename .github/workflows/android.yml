name: Build AnimeTalk AI APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'AnimeTalkAI_Android_MVP.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          unzip -q AnimeTalkAI_Android_MVP.zip -d appsrc

      - name: Grant execute permission for gradlew
        run: |
          chmod +x appsrc/gradlew || true

      - name: Build APK
        run: |
          if [ -f "appsrc/gradlew" ]; then
            cd appsrc && ./gradlew assembleDebug
          else
            gradle -p appsrc assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeTalkAI-APK
          path: appsrc/app/build/outputs/apk/debug/app-debug.apk
